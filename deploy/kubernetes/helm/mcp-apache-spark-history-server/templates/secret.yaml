{{- if .Values.auth.enabled }}
{{- range $serverName, $serverAuth := (default (dict) .Values.auth.servers) }}
{{- $serverSecret := $serverAuth.secret | default (dict) }}
{{- if $serverSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-apache-spark-history-server.serverSecretName" (dict "root" $ "server" $serverName) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mcp-apache-spark-history-server.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ $serverSecret.username | default "" | quote }}
  password: {{ $serverSecret.password | default "" | quote }}
  token: {{ $serverSecret.token | default "" | quote }}
{{- end }}
{{- end }}
{{- if .Values.auth.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-apache-spark-history-server.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-apache-spark-history-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.secret.username | default "" | quote }}
  password: {{ .Values.auth.secret.password | default "" | quote }}
  token: {{ .Values.auth.secret.token | default "" | quote }}
{{- end }}
{{- end }}
